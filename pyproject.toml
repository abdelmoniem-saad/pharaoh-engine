[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharaoh-engine"
version = "0.4.0"
description = "Mobile-first Egyptian football management simulation game"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Pharaoh Engine Team"}
]

dependencies = [
    "flet==0.80.5",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.flet]

[tool.flet.app]
# Exclude non-essential files/dirs from the app package
# The 'previous' folder alone was adding 824 MB of old APKs!
exclude = [
    "previous",
    ".git",
    ".idea",
    ".pytest_cache",
    "tests",
    "saves",
    "__pycache__",
    "*.pyc",
    "*.db",
    "buildozer.spec",
    "test_output*.txt",
]

# Android build — only arm64 (99%+ of modern phones)
[tool.flet.android]
target_arch = ["arm64-v8a"]
split_per_abi = false

