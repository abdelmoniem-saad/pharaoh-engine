[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pharaoh-engine"
version = "0.1.0"
description = "Mobile-first Egyptian football management simulation game"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Pharaoh Engine Team"}
]

dependencies = [
    "flet>=0.80.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.flet]

[tool.flet.app]
# Exclude non-essential files/dirs from the app package
# The 'previous' folder alone was adding 824 MB of old APKs!
exclude = [
    "previous",
    ".git",
    ".idea",
    ".pytest_cache",
    "tests",
    "saves",
    "__pycache__",
    "*.pyc",
    "*.db",
    "buildozer.spec",
    "test_output*.txt",
]

# Android build — only arm64 (99%+ of modern phones)
[tool.flet.android]
target_arch = ["arm64-v8a"]
split_per_abi = false

